services:
  myztplanet:
    build:
      context: .
      args:
        ZT_VERSION: ${ZT_VERSION:-1.16.2}
        ZTNCUI_COMMIT: ${ZTNCUI_COMMIT:-1b2284864de48d2dcae22582fff122fe24909c3d}
        MKWORLD_ZT_VERSION: ${MKWORLD_ZT_VERSION:-1.14.2}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: ${ZT_IMAGE:-zerotier-planet:1.16.2-optimized}
    container_name: ${CONTAINER_NAME:-myztplanet}
    network_mode: host
    restart: unless-stopped
    environment:
      IP_ADDR4: ${IP_ADDR4:?set IP_ADDR4 in .env}
      IP_ADDR6: ${IP_ADDR6:-}
      ZT_PORT: ${ZT_PORT:-9994}
      API_PORT: ${API_PORT:-3443}
      FILE_SERVER_PORT: ${FILE_SERVER_PORT:-3000}
      DEFAULT_NETWORK_MTU: ${DEFAULT_NETWORK_MTU:-1280}
      HTTP_HOST: ${HTTP_HOST:-0.0.0.0}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data/zerotier}/dist:/app/dist
      - ${DATA_DIR:-./data/zerotier}/one:/var/lib/zerotier-one
      - ${DATA_DIR:-./data/zerotier}/config:/app/config
      - ${ZTNCUI_STATE_DIR:-./data/zerotier/ztncui-state}:/var/lib/ztncui
    stop_grace_period: 20s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
