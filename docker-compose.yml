services:
  myztplanet:
    build:
      context: .
      args:
        ZT_VERSION: ${ZT_VERSION:-1.16.2}
        ZTNCUI_COMMIT: ${ZTNCUI_COMMIT:-1b2284864de48d2dcae22582fff122fe24909c3d}
        MKWORLD_ZT_VERSION: ${MKWORLD_ZT_VERSION:-1.14.2}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: ${ZT_IMAGE:-zerotier-planet:1.16.2-optimized}
    container_name: ${CONTAINER_NAME:-myztplanet}
    network_mode: host
    restart: unless-stopped
    environment:
      # Both fields are explicit: empty (including omitted .env values) disables
      # that address family; startup must not restore or auto-discover it.
      IP_ADDR4: ${IP_ADDR4:-}
      IP_ADDR6: ${IP_ADDR6:-}
      ZT_PORT: ${ZT_PORT:-9994}
      API_PORT: ${API_PORT:-3443}
      DEFAULT_NETWORK_MTU: ${DEFAULT_NETWORK_MTU:-1280}
      HTTP_HOST: ${HTTP_HOST:-127.0.0.1}
      HTTP_EXTRA_HOSTS: ${HTTP_EXTRA_HOSTS:-}
      PLANET_MODE: ${PLANET_MODE:-generated}
      ROOT_ONLY: ${ROOT_ONLY:-0}
      CONTROLLER_ONLY: ${CONTROLLER_ONLY:-0}
      ZT_PROBE_ADDR: ${ZT_PROBE_ADDR:-http://127.0.0.1:9993}
      ZT_PROBE_TOKEN_FILE: /run/zerotier-probe/authtoken.secret
      ZT_ENDPOINT_PROBES_FILE: ${ZT_ENDPOINT_PROBES_FILE:-/app/config/endpoint-probes.json}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data/zerotier}/dist:/app/dist
      - ${DATA_DIR:-./data/zerotier}/one:/var/lib/zerotier-one
      - ${DATA_DIR:-./data/zerotier}/config:/app/config
      - ${ZTNCUI_STATE_DIR:-./data/zerotier/ztncui-state}:/var/lib/ztncui
      - ${ZT_PROBE_STATE_DIR:-./data/zerotier/probe-state}:/run/zerotier-probe:ro
    stop_grace_period: 20s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
