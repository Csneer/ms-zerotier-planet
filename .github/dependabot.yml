version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Runtime major upgrades require explicit ztncui compatibility testing.
      - dependency-name: node
        update-types:
          - version-update:semver-major
