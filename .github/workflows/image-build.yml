name: Validate and publish image

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - .dockerignore
      - .env.example
      - Dockerfile
      - docker-compose.yml
      - build.sh
      - deploy.sh
      - install.sh
      - manage.sh
      - host-network-diagnostics.py
      - uninstall.sh
      - planet-bundle.sh
      - root-manage.sh
      - tests/**
      - patch/**
      - third_party/**
      - docs/**
      - examples/**
      - README.md
      - README.en.md
      - CHANGELOG.md
      - .github/workflows/image-build.yml
      - scripts/**
  pull_request:
    paths:
      - .dockerignore
      - .env.example
      - Dockerfile
      - docker-compose.yml
      - build.sh
      - deploy.sh
      - install.sh
      - manage.sh
      - host-network-diagnostics.py
      - uninstall.sh
      - planet-bundle.sh
      - root-manage.sh
      - tests/**
      - patch/**
      - third_party/**
      - docs/**
      - examples/**
      - README.md
      - README.en.md
      - CHANGELOG.md
      - .github/workflows/image-build.yml
      - scripts/**
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      zerotier_version:
        description: "ZeroTier version; blank uses the latest stable release"
        required: false
        type: string

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Keep installed deployments on the existing package after the repository rename.
  IMAGE_NAME: ${{ github.repository_owner }}/ms-zerotier-planet

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate scripts and Compose
        run: |
          cp .env.example .env
          sed -i 's/IP_ADDR4=203.0.113.10/IP_ADDR4=198.51.100.10/' .env
          for source in build.sh deploy.sh install.sh manage.sh uninstall.sh planet-bundle.sh root-manage.sh patch/entrypoint.sh patch/healthcheck.sh; do
            bash -n "$source"
          done
          for source in patch/*.js; do node --check "$source"; done
          node --check tests/multi-root.mjs
          node --check tests/browser/run.mjs
          for source in tests/*.cjs; do node --check "$source"; done
          python3 -m py_compile scripts/controller_standby.py tests/controller-standby.py
          python3 tests/host-network-diagnostics.py
          python3 tests/controller-standby.py
          node tests/ui-models.cjs
          node tests/communication-stats.cjs
          node tests/endpoint-probes.cjs
          node tests/install-config.cjs
          node tests/root-status.cjs
          node tests/host-diagnostics.cjs
          node tests/ui-listen.cjs
          node tests/ui-interactions.cjs
          node tests/manage-restore.cjs
          node tests/manage-upgrade.cjs
          node tests/native-root.cjs
          docker compose config --quiet

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve ZeroTier version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.zerotier_version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            grep -Fq "## [${GITHUB_REF_NAME#v}] - " CHANGELOG.md
            version=$(sed -n 's/^ZT_VERSION=//p' .env.example)
          elif [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          else
            version=$(curl -fsSL https://api.github.com/repos/zerotier/ZeroTierOne/releases/latest | jq -r .tag_name)
          fi
          version=${version#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref_type != 'tag' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_type != 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.version }}

      - name: Build native image for offline regression
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: zerotier-planet:ci-test
          build-args: |
            ZT_VERSION=${{ steps.version.outputs.version }}
            DEBIAN_MIRROR=default
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify signing, startup, rollback protection and authenticated UI
        # The daemon deliberately makes its bind-mounted state root-owned/0700.
        # Use root to inspect disposable state; do not relax production modes.
        run: sudo "$(command -v node)" tests/multi-root.mjs zerotier-planet:ci-test

      - name: Verify independent Root onboarding and add-only candidate flow
        # This test uses only disposable identities and a local image; it does
        # not activate a candidate or touch a production signer.
        run: sudo "$(command -v node)" tests/root-manage.cjs zerotier-planet:ci-test

      - name: Verify ordinary backup, disaster recovery and rollback
        run: sudo "$(command -v node)" tests/manage-restore-docker.cjs zerotier-planet:ci-test

      - name: Verify Root diagnostics rendering
        run: |
          docker run --rm --network none --entrypoint node \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            -e NODE_PATH=/opt/ztncui/src/node_modules \
            zerotier-planet:ci-test tests/root-diagnostics-render.cjs
          docker run --rm --network none --entrypoint node \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            -e NODE_PATH=/opt/ztncui/src/node_modules \
            zerotier-planet:ci-test tests/monitor-focus.cjs

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser regression dependencies
        run: |
          npm ci --prefix tests/browser
          cd tests/browser
          npx playwright install --with-deps chromium

      - name: Verify network workflows in Chromium
        timeout-minutes: 10
        run: node tests/browser/run.mjs zerotier-planet:ci-test

      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ZT_VERSION=${{ steps.version.outputs.version }}
            DEBIAN_MIRROR=default
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
