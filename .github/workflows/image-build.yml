name: Validate and publish image

on:
  push:
    branches: [master, main]
    paths:
      - .dockerignore
      - .env.example
      - Dockerfile
      - docker-compose.yml
      - build.sh
      - deploy.sh
      - install.sh
      - manage.sh
      - uninstall.sh
      - patch/**
      - .github/workflows/image-build.yml
  pull_request:
    paths:
      - .dockerignore
      - .env.example
      - Dockerfile
      - docker-compose.yml
      - build.sh
      - deploy.sh
      - install.sh
      - manage.sh
      - uninstall.sh
      - patch/**
      - .github/workflows/image-build.yml
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      zerotier_version:
        description: "ZeroTier version; blank uses the latest stable release"
        required: false
        type: string

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts and Compose
        run: |
          cp .env.example .env
          sed -i 's/IP_ADDR4=203.0.113.10/IP_ADDR4=198.51.100.10/' .env
          bash -n build.sh deploy.sh install.sh manage.sh uninstall.sh patch/entrypoint.sh patch/healthcheck.sh
          node --check patch/http_server.js
          node --check patch/downloadsController.js
          docker compose config --quiet

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ZeroTier version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.zerotier_version }}
        run: |
          version="${REQUESTED_VERSION}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL https://api.github.com/repos/zerotier/ZeroTierOne/releases/latest | jq -r .tag_name)
          fi
          version=${version#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ZT_VERSION=${{ steps.version.outputs.version }}
            DEBIAN_MIRROR=default
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
